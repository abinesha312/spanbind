[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spanbind"
version = "0.1.0"
description = "Fail CI when an LLM/RAG answer contains claims not bound to source spans."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Abinesh H" }]
keywords = ["rag", "citation", "pytest", "llm", "grounding"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/abinesha312/spanbind"
Repository = "https://github.com/abinesha312/spanbind"

[project.scripts]
spanbind = "spanbind.cli:main"

[project.entry-points.pytest11]
spanbind = "spanbind.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
spanbind = ["data/*", "data/sources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
